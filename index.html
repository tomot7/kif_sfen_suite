<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIF/SFEN ツール集</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            background: radial-gradient(1200px 800px at 10% 10%, rgba(16,185,129,0.25), transparent 60%),
                        radial-gradient(1000px 700px at 90% 20%, rgba(34,197,94,0.22), transparent 55%),
                        linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(2, 6, 23, 0.98));
        }
        .text-gray-900, .text-gray-800 { color: #f8fafc !important; }
        .text-gray-700, .text-gray-600, .text-gray-500 { color: #e2e8f0 !important; }
        .text-gray-400 { color: #cbd5e1 !important; }
        .card { transition: transform .2s ease, box-shadow .2s ease; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,0.12); }
        .glass-card {
            background: rgba(16, 185, 129, 0.12) !important;
            border: 1px solid rgba(16, 185, 129, 0.28) !important;
            backdrop-filter: blur(14px);
        }
    </style>
</head>
<body class="text-gray-100">
    <div class="container mx-auto p-6 md:p-10 max-w-5xl">
        <header class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-white">KIF/SFEN ツール集</h1>
            <p class="mt-3 text-gray-600 dark:text-gray-400">KIF変換とSFEN閲覧を1つのプロジェクトに統合しました。</p>
        </header>

        <main class="grid md:grid-cols-3 gap-6">
            <a href="./kif_to_sfen/index.html" class="card glass-card block rounded-xl p-6 shadow">
                <h2 class="text-xl font-semibold text-gray-900 dark:text-white">KIF → SFEN 変換</h2>
                <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">KIF/KIFUファイルやテキストからSFENを生成し、CSV出力にも対応。</p>
                <div class="mt-4 inline-block text-emerald-400 font-semibold">開く →</div>
            </a>

            <a href="./sfen_viewer/index.html" class="card glass-card block rounded-xl p-6 shadow">
                <h2 class="text-xl font-semibold text-gray-900 dark:text-white">SFEN 局面ビューア</h2>
                <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">CSVから局面を一覧表示し、コメント管理と保存にも対応。</p>
                <div class="mt-4 inline-block text-emerald-400 font-semibold">開く →</div>
            </a>

            <a href="./data_manager/index.html" class="card glass-card block rounded-xl p-6 shadow">
                <h2 class="text-xl font-semibold text-gray-900 dark:text-white">SFEN データ管理</h2>
                <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">データ登録・削除・ユーザー管理を行います。</p>
                <div class="mt-4 inline-block text-emerald-400 font-semibold">開く →</div>
            </a>
        </main>

        <footer class="text-center mt-10 text-xs text-gray-500 dark:text-gray-400">
            <p>このプロジェクトはローカルで完結する静的アプリです。</p>
        </footer>
    </div>
</body>
</html>
