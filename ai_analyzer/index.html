<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="credentialless">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI解析（単体）</title>
  <script type="importmap">
    {
      "imports": {
        "@badrap/result": "../sfen_viewer/vendors/@badrap/result/dist/index.js"
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../sfen_viewer/styles.css" />
</head>
<body class="text-gray-100">
  <div class="container mx-auto p-4 md:p-8 mobile-tight">
    <header class="text-center mb-8">
      <h1 class="text-3xl md:text-4xl font-bold text-gray-900">AI解析（単体）</h1>
      <p class="mt-2 text-gray-600">SFENを入力してブラウザ上でAI解析します。</p>
      <div class="mt-4 flex flex-wrap justify-center gap-3 text-sm">
        <a href="../index.html" class="text-emerald-400 hover:underline">トップ</a>
        <span class="text-gray-400">|</span>
        <a href="../sfen_viewer/index.html" class="text-emerald-400 hover:underline">SFEN局面ビューア</a>
        <span class="text-gray-400">|</span>
        <a href="../data_manager/index.html" class="text-emerald-400 hover:underline">データ管理</a>
        <span class="text-gray-400">|</span>
        <a href="../kif_to_sfen/index.html" class="text-emerald-400 hover:underline">KIF→SFEN変換</a>
      </div>
    </header>

    <div class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-1 space-y-4">
        <div class="panel-card rounded-lg p-4">
          <label for="sfen-input" class="block text-sm font-semibold text-gray-700 mb-2">SFEN文字列</label>
          <textarea id="sfen-input" rows="4" class="input-dark w-full p-2 rounded-md text-sm" placeholder="SFENを貼り付け（例: lnsgkgsnl/... b - 1）"></textarea>
          <div class="flex flex-wrap gap-2 mt-3">
            <button id="load-startpos" class="btn-soft px-3 py-2 rounded-md text-xs">初期局面</button>
            <button id="apply-sfen" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold px-3 py-2 rounded-md">解析を開始</button>
          </div>
          <p class="text-xs text-gray-500 mt-2">現在局面のSFEN: <span id="current-sfen" class="wrap-any text-gray-300"></span></p>
        </div>

        <div class="panel-card rounded-lg p-4 space-y-2">
          <div>深さ: <span id="info-depth">-</span> / ノード: <span id="info-nodes">-</span> / NPS: <span id="info-nps">-</span></div>
          <div>評価値: <span id="info-score">-</span> / 経過: <span id="info-time">-</span> ms</div>
          <div class="flex flex-wrap gap-3 items-center text-xs">
            <label class="flex items-center gap-1">解析時間(秒)
              <input id="analysis-movetime" type="number" value="30" min="1" class="w-24 rounded-md border-gray-300 dark:bg-gray-700 dark:border-gray-600 shadow-sm">
            </label>
            <label class="flex items-center gap-1">MultiPV
              <select id="analysis-multipv" class="w-24 rounded-md border-gray-300 dark:bg-gray-700 dark:border-gray-600 shadow-sm">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3" selected>3</option>
                <option value="5">5</option>
              </select>
            </label>
          </div>
          <div class="flex flex-wrap gap-2">
            <button id="analysis-start" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold py-2 px-3 rounded-md">解析開始</button>
            <button id="analysis-stop" class="btn-soft text-xs py-2 px-3 rounded-md">停止</button>
            <button id="analysis-reset" class="btn-soft text-xs py-2 px-3 rounded-md">初期局面に戻す</button>
          </div>
          <div id="analysis-status" class="text-xs text-gray-500"></div>
        </div>

        <div class="panel-card rounded-lg p-4 space-y-2">
          <div class="flex items-center justify-between">
            <h4 class="font-semibold text-sm">AI推奨候補</h4>
            <button id="apply-pv" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold py-2 px-3 rounded-md">最善手を指す</button>
          </div>
          <div id="pv-lines" class="text-xs space-y-1 max-h-60 overflow-y-auto"></div>
        </div>

        <div class="panel-card rounded-lg p-4">
          <div class="text-sm font-semibold mb-2">手順再現</div>
          <div id="replay-status" class="text-xs text-gray-500 mb-2">候補手の「手順を再現」を押してください。</div>
          <div class="flex flex-wrap gap-2 text-xs">
            <button id="replay-next" class="btn-soft px-3 py-2 rounded-md">次の手へ</button>
            <button id="replay-adopt" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-2 rounded-md">この局面を解析する</button>
            <button id="replay-stop" class="btn-soft px-3 py-2 rounded-md">再現を終了</button>
          </div>
        </div>
      </div>

      <div class="lg:col-span-2">
        <div class="panel-card rounded-lg p-4">
          <div class="flex flex-wrap items-start justify-center gap-4">
            <div class="flex flex-col items-center text-xs">
              <div class="font-semibold mb-2">後手持ち駒</div>
              <div id="hand-gote" class="flex flex-col gap-1"></div>
            </div>
            <div id="analysis-board" class="flex justify-center"></div>
            <div class="flex flex-col items-center text-xs">
              <div class="font-semibold mb-2">先手持ち駒</div>
              <div id="hand-sente" class="flex flex-col gap-1"></div>
            </div>
          </div>
          <div class="mt-3 text-xs text-gray-500">盤をクリックして合法手のみ指せます。着手履歴は日本語表記で表示されます。</div>
        </div>
        <div class="panel-card rounded-lg p-4 mt-3">
          <h4 class="font-semibold mb-2 text-sm">現在の手順</h4>
          <div id="played-moves" class="text-xs space-y-1 max-h-40 overflow-y-auto"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../sfen_viewer/app.js"></script>
  <script type="module" src="analyzer.js"></script>
</body>
</html>
